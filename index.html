<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1f3b33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boteco do Dida">
<title>Boteco do Dida</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f1f3f0;
  --surface: #ffffff;
  --surface-2: #f7f8f6;
  --ink: #18221e;
  --muted: #5d6a64;
  --line: #dde2de;
  --brand: #1f3b33;
  --brand-2: #2b4c42;
  --brand-ink: #eef1ea;
  --brand-muted: #a9bcb3;
  --accent: #e3a72a;
  --accent-ink: #2a1d02;
  --ok: #17724a; --ok-bg: #dcf0e5;
  --warn: #9a5a00; --warn-bg: #fbecd2;
  --bad: #b3261e; --bad-bg: #fbe1de;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 4px 16px rgba(20,30,25,.06);
  --seg-on: #1f3b33; --seg-on-ink: #eef1ea;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #19211e; --surface-2: #1e2824; --ink: #e6ece8; --muted: #97a59e; --line: #2b3732;
    --brand: #0c1714; --brand-2: #17271f; --brand-ink: #e6ece8; --brand-muted: #8aa197;
    --accent: #f0b73e; --accent-ink: #261a00;
    --ok: #5fd39c; --ok-bg: #153527; --warn: #f2b05a; --warn-bg: #3a2a12;
    --bad: #ff8f86; --bad-bg: #3d1a17;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --seg-on: #f0b73e; --seg-on-ink: #261a00;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #19211e; --surface-2: #1e2824; --ink: #e6ece8; --muted: #97a59e; --line: #2b3732;
  --brand: #0c1714; --brand-2: #17271f; --brand-ink: #e6ece8; --brand-muted: #8aa197;
  --accent: #f0b73e; --accent-ink: #261a00;
  --ok: #5fd39c; --ok-bg: #153527; --warn: #f2b05a; --warn-bg: #3a2a12;
  --bad: #ff8f86; --bad-bg: #3d1a17;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  --seg-on: #f0b73e; --seg-on-ink: #261a00;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ===== shell ===== */
.shell { display: flex; flex-direction: column; min-height: 100%; min-height: 100dvh; }
main { flex: 1; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(80px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; }
main > * { flex: none; }
/* iPhone com o app instalado: o relógio e a bateria ficam por cima do app, em branco.
   Esta faixa na cor da marca fica atrás deles (texto legível) e o conteúdo começa abaixo.
   Nos outros aparelhos a altura é 0. */
.statusbar-bg { position: fixed; z-index: 40; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px); background: var(--brand); }
nav.tabs {
  position: fixed; z-index: 30; left: 0; right: 0; bottom: 0;
  background: var(--brand); display: flex;
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
}
nav.tabs button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: 0; border: 0; border-radius: 12px; padding: 7px 2px; min-height: 54px;
  color: var(--brand-muted); font-size: .8rem; font-weight: 600; position: relative;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--brand-ink); background: var(--brand-2); }
nav.tabs button.on svg { color: var(--accent); }
nav.tabs .badge {
  position: absolute; top: 4px; right: calc(50% - 20px);
  background: var(--accent); color: var(--accent-ink); border-radius: 99px;
  font-size: .7rem; font-weight: 800; min-width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center; padding: 0 5px;
}

/* ===== header ===== */
.hdr { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.hdr h1 { font-size: 1.5rem; font-weight: 800; }
.hdr-sub { color: var(--muted); font-size: .88rem; margin-top: -10px; margin-bottom: 8px; }

/* ===== date picker button ===== */
.date-picker-btn {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  width: 100%; text-align: left; margin-bottom: 14px; min-height: 52px;
}
.date-picker-btn svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.date-picker-btn .dp-text { flex: 1; }
.date-picker-btn .dp-text b {
  display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem;
}
.date-picker-btn .dp-text span { color: var(--muted); font-size: .82rem; }
.date-picker-btn .dp-arrow { color: var(--muted); flex: none; transition: transform .15s; }
.date-picker-btn.open .dp-arrow { transform: rotate(180deg); }

/* ===== calendário dropdown ===== */
.cal-drop {
  overflow: hidden; max-height: 0; opacity: 0; transition: max-height .25s ease, opacity .15s ease;
  margin-bottom: 0; position: relative; z-index: 10;
}
.cal-drop.open { max-height: 420px; opacity: 1; margin-bottom: 14px; }
.cal-wrap {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px; overflow: hidden;
}
.cal-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-nav .label { flex: 1; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; text-transform: capitalize; }
.cal-nav button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
.cal-nav button svg { width: 18px; height: 18px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; width: 100%; }
.cal .wd { text-align: center; font-size: .76rem; font-weight: 700; color: var(--muted); text-transform: uppercase; padding: 2px 0; }
.cal .day {
  aspect-ratio: 1; border-radius: 10px; border: 0; background: var(--surface-2); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font-weight: 600; font-size: .88rem; position: relative; border: 1px solid transparent;
  padding: 0; min-width: 0;
}
.cal .day.empty { background: transparent; border-color: transparent; }
.cal .day.today { border-color: var(--accent); border-width: 2px; }
.cal .day.sel { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.cal .day.has::after {
  content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  position: absolute; bottom: 3px;
}
.cal .day.sel.has::after { background: var(--brand-ink); }

/* ===== dia (escala do dia selecionado) ===== */
.day-panel { margin-top: 14px; }
.day-title { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; margin-bottom: 10px; }
.person-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 0;
  border-top: 1px solid var(--line);
}
.person-row:first-child { border-top: 0; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: var(--accent);
  display: grid; place-items: center; font-weight: 700; font-family: var(--font-display);
  flex: none; font-size: .85rem;
}
.person-info { flex: 1; min-width: 0; }
.person-info b { display: block; font-weight: 700; overflow-wrap: anywhere; font-size: .95rem; }
.person-info span { color: var(--muted); font-size: .87rem; }
.presence { display: flex; gap: 6px; flex: none; }
.presence .btn { min-width: 76px; }
.presence button.paid-lock {
  min-width: 100px; min-height: 44px; border-radius: 10px; border: 0; font-weight: 700; font-size: .9rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--ok-bg); color: var(--ok);
}
.presence button.paid-lock svg { width: 16px; height: 16px; }

/* ===== lista de pagamentos ===== */
.pay-row {
  display: flex; align-items: center; gap: 10px; padding: 12px 0;
  border-top: 1px solid var(--line); flex-wrap: wrap;
}
.pay-row:first-child { border-top: 0; }
.pay-info { flex: 1; min-width: 0; }
.pay-info b { display: block; font-weight: 700; }
.pay-info span { color: var(--muted); font-size: .88rem; }
.pay-val { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 1rem; }
.pay-actions { display: flex; gap: 6px; width: 100%; padding-left: 50px; flex-wrap: wrap; }
.pay-actions button { flex: 1; }
.pay-row.paid .pay-info b, .pay-row.paid .pay-val { color: var(--muted); }
.pay-row.paid .avatar { background: var(--surface-2); color: var(--muted); }
.q-nav { margin-bottom: 14px; }
.q-nav .label small { display: block; font-family: var(--font-body); font-weight: 500; font-size: .82rem; color: var(--muted); text-transform: none; }
.q-nav .label div::first-letter { text-transform: uppercase; }
.q-nav .label { text-transform: none; }
.notice {
  display: flex; align-items: center; gap: 10px; background: var(--warn-bg); color: var(--warn);
  border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-weight: 600; font-size: .88rem;
}
.notice span { flex: 1; }

/* ===== resumo ===== */
.sum-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;
}
.sum-card .top { display: flex; align-items: center; gap: 10px; }
.sum-card .detail { color: var(--muted); font-size: .88rem; padding-left: 50px; }
.sum-card .detail b { color: var(--ink); }
.sum-card .actions { display: flex; gap: 8px; padding-left: 50px; }

/* ===== pessoas ===== */
.pcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; margin-bottom: 10px;
}
.pcard .top { display: flex; align-items: center; gap: 10px; }
.pcard .meta { color: var(--muted); font-size: .85rem; margin-top: 8px; padding-left: 50px; }
.pcard .meta span + span::before { content: " · "; }
.pcard .pactions { display: flex; gap: 8px; margin-top: 8px; padding-left: 50px; }

/* ===== botões ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; color: var(--ink); white-space: nowrap;
  font-size: .88rem; text-decoration: none;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.btn.wa { background: #1f8f4e; color: #fff; border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: transparent; }
.btn.ghost { background: 0; border-color: transparent; }
.btn.sm { min-height: 44px; padding: 0 12px; font-size: .9rem; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* ===== toque e destaque ===== */
/* o app desliga o "piscar" padrão do toque: no lugar, o botão afunda e escurece de leve
   na hora, para ela ver que o toque pegou (e não tocar de novo) */
button, .btn { transition: transform .08s ease, filter .08s ease; }
button:active:not([disabled]), .btn:active { transform: scale(.96); filter: brightness(.92); }
/* destaque rápido de onde algo foi parar (linha paga, gente recém-escalada): só cor, sem movimento */
@keyframes flash { from { background-color: var(--ok-bg); } to { background-color: transparent; } }
.flash { animation: flash 1.4s ease-out; border-radius: 10px; }
.total-card.flash { animation-name: flash-card; }
@keyframes flash-card { from { box-shadow: 0 0 0 3px var(--ok); } to { box-shadow: 0 0 0 3px transparent; } }
@media (prefers-reduced-motion: reduce) {
  button, .btn { transition: none; }
  button:active:not([disabled]), .btn:active { transform: none; }
}

/* ===== formulários ===== */
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: .82rem; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea {
  min-height: 46px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface-2); padding: 0 12px; width: 100%;
}
.field textarea { padding: 10px 12px; min-height: 70px; resize: vertical; }
.field .hint { font-size: .84rem; color: var(--muted); }
.form { display: flex; flex-direction: column; gap: 12px; }

/* ===== chips ===== */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line);
  background: var(--surface); border-radius: 99px; padding: 5px 12px;
  font-size: .82rem; font-weight: 600; min-height: 36px;
}
button.chip:hover { background: var(--surface-2); }
.chip.active { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.chip .x { font-size: .7rem; margin-left: 2px; }
.chips.seg { margin-bottom: 12px; gap: 8px; }
.chips.seg .chip { flex: 1; justify-content: center; min-height: 42px; font-size: .9rem; }
.chips.seg .chip.active { background: var(--seg-on); color: var(--seg-on-ink); border-color: transparent; }

/* ===== fila de envio do resumo ===== */
.queue-hint { color: var(--muted); font-size: .87rem; margin-top: 6px; text-align: center; }
.queue-done {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--ok-bg); color: var(--ok); border-radius: 12px;
  padding: 11px 12px; font-weight: 700; font-size: .9rem;
}
.queue-done svg { width: 18px; height: 18px; }
.btn.wa.sent { background: var(--surface); color: var(--muted); border-color: var(--line); }
.sum-card .pill { align-self: flex-start; }

/* ===== modal ===== */
.scrim {
  position: fixed; inset: 0; z-index: 50; background: rgba(8,14,12,.5);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  background: var(--surface); width: 100%; max-height: 92vh; display: flex;
  flex-direction: column; border-radius: 20px 20px 0 0;
  box-shadow: 0 -8px 40px rgba(0,0,0,.25);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 6px; }
.sheet-head h2 { font-size: 1.2rem; }
.sheet-body { overflow-y: auto; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) {
  .scrim { align-items: center; padding: 24px; }
  .sheet { max-width: 520px; border-radius: 20px; max-height: 85vh; }
}
@media (prefers-reduced-motion: no-preference) {
  .scrim { animation: fade .15s ease-out; }
  .sheet { animation: rise .2s ease-out; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(20px); opacity: .6; } }

/* ===== toast ===== */
.toast {
  position: fixed; z-index: 80; left: 50%; transform: translateX(-50%);
  bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px;
  font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--shadow); font-size: .9rem;
}

/* ===== rodapé do app ===== */
.app-footer {
  margin-top: auto; padding-top: 30px;
  display: flex; flex-direction: column; align-items: center; gap: 7px;
}
.app-footer img { width: 44px; height: 44px; border-radius: 50%; }
.app-footer a {
  color: var(--muted); font-size: .82rem; font-weight: 600;
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
  min-height: 34px; padding: 0 8px;
}
.app-footer a svg { width: 16px; height: 16px; }

/* ===== vazio ===== */
.empty { text-align: center; padding: 32px 16px; color: var(--muted); }
.empty b { display: block; font-family: var(--font-display); color: var(--ink); font-size: 1.15rem; margin-bottom: 6px; }

/* ===== manual ===== */
.help section + section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.help h3 { font-size: 1.05rem; margin-bottom: 6px; }
.help ul { padding-left: 18px; display: flex; flex-direction: column; gap: 7px; }
.help li { font-size: .93rem; }

/* ===== backup ===== */
.section-title { font-family: var(--font-display); font-weight: 700; font-size: .82rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
.section-title:first-child { margin-top: 0; }
.note { color: var(--muted); font-size: .87rem; text-align: center; }

/* ===== pill ===== */
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 2px 8px; font-size: .78rem; font-weight: 700; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }

/* ===== totais ===== */
.totals {
  display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
}
.total-card {
  flex: 1 1 120px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 12px; min-width: 0;
}
.total-card.hl { background: var(--brand); border-color: transparent; color: var(--brand-ink); }
.total-card .lbl { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.total-card.hl .lbl { color: var(--brand-muted); }
.total-card .val { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.total-card.hl .val { color: var(--accent); }

/* ===== pick list ===== */
.pick-list { display: flex; flex-direction: column; max-height: 50vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; }
.pick { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); min-height: 52px; }
.pick:first-child { border-top: 0; }
.pick input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--brand); flex: none; }

/* ===== tablet ===== */
@media (min-width: 860px) {
  .shell { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 1fr; }
  nav.tabs {
    position: sticky; top: 0; height: 100vh; height: 100dvh;
    flex-direction: column; gap: 16px; padding: calc(24px + env(safe-area-inset-top, 0px)) 12px 20px;
  }
  nav.tabs .brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; margin-bottom: 6px; }
  nav.tabs .brand b { font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; color: var(--brand-ink); }
  nav.tabs .brand small { color: var(--brand-muted); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  nav.tabs button {
    flex: none; flex-direction: row; justify-content: flex-start; gap: 10px;
    font-size: .92rem; padding: 10px 10px; min-height: 46px;
  }
  nav.tabs .badge { position: static; }
  main { padding: calc(28px + env(safe-area-inset-top, 0px)) 28px 40px; }
  .toast { bottom: 28px; }
}
</style>
</head>
<body>
<div class="statusbar-bg"></div>
<div class="shell">
  <nav class="tabs" id="nav">
    <div class="brand" hidden><b>Boteco do Dida</b><small>Freelancers</small></div>
  </nav>
  <main id="main"></main>
</div>
<div id="overlay"></div>

<script src="firebase-config.js"></script>
<script>
(function(){
"use strict";

/* ================== dados ================== */
var KEY = "botecoDida.v2";
var brl = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});

function emptyDb(){
  return { people:[], entries:[], discounts:[], sends:[], confirms:[], functions:[], settings:{lastBackup:null} };
}
/* texto que esta janela leu ou gravou por último: se o salvo mudar sem ser por ela,
   foi outra janela do app (aba do navegador + app instalado usam os mesmos dados) */
var savedJson = null;
/* dados salvos que não deu para ler: em vez de começar vazio e gravar por cima, guarda uma
   cópia à parte (que também vai junto no backup, para dar para recuperar). Se nem a cópia
   couber, o app não grava nada até alguém olhar. */
var DAMAGED = KEY+".danificado.", dbLocked = false, lastDamaged = null;
function loadDb(){
  var raw = null;
  try {
    raw = localStorage.getItem(KEY);
    savedJson = raw;
    var r = JSON.parse(raw||"null");
    if(r && Array.isArray(r.people) && Array.isArray(r.entries)){
      normalizeDb(r);
      if(!Array.isArray(r.functions)) r.functions = [];
      r.settings = Object.assign(emptyDb().settings, r.settings||{});
      return r;
    }
  } catch(e){}
  if(raw && raw!==lastDamaged){
    lastDamaged = raw;
    try { localStorage.setItem(DAMAGED+Date.now(), raw); localStorage.removeItem(KEY+".danificado-visto"); }
    catch(e){ dbLocked = true; }
  }
  return emptyDb();
}
function damagedKeys(){
  var ks=[];
  try { for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf(DAMAGED)===0) ks.push(k); } } catch(e){}
  return ks.sort();
}
var db = loadDb();
/* pede ao navegador para não apagar os dados quando faltar espaço no celular */
if(navigator.storage&&navigator.storage.persisted&&navigator.storage.persist){
  navigator.storage.persisted().then(function(ok){ if(!ok) return navigator.storage.persist(); }).catch(function(){});
}
function persist(){
  if(dbLocked){ toast("Os dados deste celular estão danificados. Chame quem instalou o app antes de continuar."); return false; }
  try {
    if(localStorage.getItem(KEY)!==savedJson){
      /* outra janela salvou e esta não ficou sabendo: não grava por cima */
      toast("O app estava aberto em outra janela. Confira e faça de novo.");
      return false;
    }
    var s=JSON.stringify(db), before=savedJson;
    localStorage.setItem(KEY,s); savedJson=s;
    cloudQueue(before,db); return true;
  }
  catch(e){ toast("Sem espaço para salvar. Libere espaço no aparelho."); return false; }
}
/* traz o que outra janela salvou; diz se mudou */
function syncDb(){
  var raw;
  try { raw=localStorage.getItem(KEY); } catch(e){ return false; }
  if(raw===savedJson) return false;
  db=loadDb(); return true;
}

/* ================== utilitários ================== */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fromIso(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
/* "hoje" é o dia do expediente: até as 6h da manhã ainda conta como o dia anterior,
   porque o turno da noite passa da meia-noite (marcar presença à 1h cai no dia certo) */
function dayOf(t){ var d=new Date(t); if(d.getHours()<6) d.setDate(d.getDate()-1); return iso(d); }
function today(){ return dayOf(Date.now()); }
/* quem está escalado conta como quem trabalhou, a partir do próprio dia (hoje ou antes).
   Quem não veio é tirado da escala. Dia futuro ainda não conta. */
function counts(e){ return e.date<=today(); }
/* versões antigas tinham "Veio"/"Faltou": falta some (não valia dinheiro) e o resto vira escalado */
function normalizeDb(r){
  r.entries=r.entries.filter(function(e){ return e.status!=="falta"; });
  r.entries.forEach(function(e){ e.status="escalado"; });
  if(!Array.isArray(r.discounts)) r.discounts=[];
  if(!Array.isArray(r.sends)) r.sends=[];
  if(!Array.isArray(r.confirms)) r.confirms=[];
  return r;
}
function addDays(s,n){ var d=fromIso(s); d.setDate(d.getDate()+n); return iso(d); }

var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function ddmm(s){ var d=fromIso(s); return pad(d.getDate())+"/"+pad(d.getMonth()+1); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtDayLong(s){
  var d=fromIso(s);
  return cap(WDL[d.getDay()])+", "+d.getDate()+" de "+MESES[d.getMonth()];
}
function money(n){ return brl.format(+n||0); }
function parseMoney(v){
  var s=String(v||"").trim().replace(/[^\d,.]/g,"");
  if(s.indexOf(",")>-1) s=s.replace(/\./g,"").replace(",",".");
  /* sem vírgula, "1.500" é mil e quinhentos (ponto de milhar), não 1,50 */
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  var n=parseFloat(s); return isFinite(n)?Math.round(n*100)/100:0;
}
function moneyInput(n){ return n?String(n.toFixed(2)).replace(".",","):""; }
function initials(name){
  var p=String(name).trim().split(/\s+/);
  return ((p[0]||"")[0]+((p.length>1?p[p.length-1][0]:"")||"")).toUpperCase();
}
function firstName(name){ return String(name).trim().split(/\s+/)[0]; }
function person(id){ for(var i=0;i<db.people.length;i++) if(db.people[i].id===id) return db.people[i]; return null; }
function nameOf(e){ var p=person(e.personId); return p?p.name:"Removido"; }

function waNumber(phone){
  var d=String(phone||"").replace(/\D/g,"").replace(/^0+/,"");
  if(d.length===10||d.length===11) d="55"+d;
  return d.length>=12?d:"";
}

/* semana seg-dom */
function weekRange(anchor){
  var d=fromIso(anchor), dow=(d.getDay()+6)%7;
  var start=addDays(anchor,-dow);
  return {start:start, end:addDays(start,6)};
}

/* quinzena: 1ª = dia 1 a 15, 2ª = dia 16 ao último dia do mês */
function quinzena(anchor){
  var d=fromIso(anchor), y=d.getFullYear(), m=d.getMonth();
  var first=d.getDate()<=15;
  var start=iso(new Date(y,m,first?1:16));
  var end=iso(first?new Date(y,m,15):new Date(y,m+1,0));
  return {start:start,end:end,first:first,
    label:(first?"1ª":"2ª")+" quinzena de "+MESES[m],
    range:ddmm(start)+" a "+ddmm(end)};
}
function prevQuinzena(q){ return quinzena(addDays(q.start,-1)); }
function nextQuinzena(q){ return quinzena(addDays(q.end,1)); }
function inQ(e,q){ return e.date>=q.start&&e.date<=q.end; }

/* ================== DOM helpers ================== */
function $(s){ return document.querySelector(s); }
function h(tag,a){
  var el=document.createElement(tag);
  if(a) for(var k in a){
    var v=a[k];
    if(v==null||v===false) continue;
    if(k==="text") el.textContent=v;
    else if(k==="html") el.innerHTML=v;
    else if(k==="class") el.className=v;
    else if(k==="value") el.value=v;
    else if(k==="checked") el.checked=!!v;
    else if(k.slice(0,2)==="on") el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?"":v);
  }
  for(var i=2;i<arguments.length;i++) addChild(el,arguments[i]);
  return el;
}
function addChild(el,c){
  if(c==null||c===false) return;
  if(Array.isArray(c)){ c.forEach(function(x){addChild(el,x);}); return; }
  el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
}

var toastTimer;
function toast(msg){
  var old=$(".toast"); if(old) old.remove();
  var t=h("div",{class:"toast",role:"status",text:msg});
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.remove();},2800);
}

function copyText(txt,okMsg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast(okMsg);},function(){fallback();});
  } else fallback();
  function fallback(){
    var ta=h("textarea",{style:"position:fixed;opacity:0;left:0;top:0"}); ta.value=txt;
    document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy");toast(okMsg);}catch(e){toast("Não consegui copiar.");}
    ta.remove();
  }
}

/* botão confirmar com 2 toques */
function confirmBtn(label,armedLabel,cls,fn){
  var armed=false,timer;
  var b=h("button",{class:"btn "+cls,type:"button",text:label,onclick:function(){
    if(!armed){armed=true;b.textContent=armedLabel;b.classList.add("armed");
      timer=setTimeout(function(){armed=false;b.textContent=label;b.classList.remove("armed");},3500);
      return;}
    clearTimeout(timer); fn();
  }});
  return b;
}

/* ================== modal ================== */
/* logo depois de abrir ou fechar uma janela, ignora toques por um instante: o 2º toque
   de um toque duplo não cai no que estava por baixo (fechar a janela, trocar de aba) */
var tapGuardUntil=0;
/* no iPhone, o efeito de "afundar" do botão (:active) só aparece se a página escutar toques */
document.addEventListener("touchstart",function(){},{passive:true});
document.addEventListener("click",function(e){
  if(performance.now()<tapGuardUntil){ e.preventDefault(); e.stopPropagation(); }
},true);
function closeSheet(){
  $("#overlay").textContent=""; document.removeEventListener("keydown",escClose);
  tapGuardUntil=performance.now()+350;
}
function escClose(e){ if(e.key==="Escape") closeSheet(); }
function openSheet(title,body){
  closeSheet();
  var panel=h("div",{class:"sheet",role:"dialog","aria-modal":"true","aria-label":title},
    h("div",{class:"sheet-head"},h("h2",{text:title}),
      h("button",{class:"icon-btn",type:"button","aria-label":"Fechar",onclick:closeSheet},icon("x"))),
    h("div",{class:"sheet-body"},body));
  var scrim=h("div",{class:"scrim",onclick:function(e){if(e.target===scrim)closeSheet();}},panel);
  $("#overlay").appendChild(scrim);
  document.addEventListener("keydown",escClose);
}

function renderNav(){
  var nav=$("#nav");
  nav.textContent="";
  /* brand para tablet */
  var brand=h("div",{class:"brand"});
  addChild(brand,h("b",{text:"Boteco do Dida"}));
  addChild(brand,h("small",{text:"Freelancers"}));
  nav.appendChild(brand);

  if(window.innerWidth>=860) brand.hidden=false; else brand.hidden=true;

  /* número na aba "A pagar": pessoas com quinzena já fechada sem pagar. O que é da quinzena
     em andamento não conta, senão o número fica aceso o tempo todo e ela para de olhar. */
  var curQ=quinzena(today()).start, need={};
  db.entries.forEach(function(e){
    if(!e.paid&&e.date<curQ) need[e.personId]=true;
  });
  var pending=Object.keys(need).length;
  TABS.forEach(function(t){
    var b=h("button",{type:"button",onclick:function(){ goTab(t[0]); }},icon(t[2]),h("span",{text:t[1]}));

      addChild(b,h("span",{class:"badge",text:String(pending)}));
    }
    nav.appendChild(b);
  });
}
function goTab(tab){

  openSheet("Como usar",body);
}

/* ================== ESCALA ================== */
function renderEscala(){
  var main=$("#main"); main.textContent="";

  addChild(main,header("Escala"));
  addChild(main,damagedNotice());
  addChild(main,backupNotice());

  /* date picker button */
  var dayLabel=fmtDayLong(ui.selDay);

    ui.calOpen=!ui.calOpen; render();
  }},
    icon("cal"),
    h("div",{class:"dp-text"},
      h("b",{text:dayLabel}),
      h("span",{text:monthYearLabel})
    ),
    icon("chevdown")
  );
  dpBtn.lastChild.classList.add("dp-arrow");
  main.appendChild(dpBtn);

  /* calendar dropdown */
  var drop=h("div",{class:"cal-drop"+(ui.calOpen?" open":"")});

      render();
    }},icon("prev")),
    h("span",{class:"label",text:monthLabel}),
    h("button",{type:"button","aria-label":"Próximo mês",onclick:function(){
      ui.calMonth++; if(ui.calMonth>11){ui.calMonth=0;ui.calYear++;}
      render();
    }},icon("next"))
  );
  wrap.appendChild(cn);

  /* calendário grid */
  var cal=h("div",{class:"cal"});
  ["S","T","Q","Q","S","S","D"].forEach(function(d){
    cal.appendChild(h("span",{class:"wd",text:d}));
  });

  var first=new Date(ui.calYear,ui.calMonth,1);
  var startDow=(first.getDay()+6)%7;
  var daysInMonth=new Date(ui.calYear,ui.calMonth+1,0).getDate();
  var t=today();

  /* bolinha: dia com gente escalada */
  var daysWithEntries={};
  db.entries.forEach(function(e){
    var d=fromIso(e.date);
    if(d.getMonth()===ui.calMonth&&d.getFullYear()===ui.calYear){
      daysWithEntries[e.date]=true;
    }
  });

  for(var i=0;i<startDow;i++) cal.appendChild(h("button",{class:"day empty",disabled:true}));

  for(var d=1;d<=daysInMonth;d++){
    var ds=iso(new Date(ui.calYear,ui.calMonth,d));
    var cls="day";
    if(ds===t) cls+=" today";
    if(ds===ui.selDay) cls+=" sel";
    if(daysWithEntries[ds]) cls+=" has";

      cal.appendChild(h("button",{class:cls,type:"button",text:String(d),onclick:function(){
        ui.selDay=ds; ui.calOpen=false; render();
      }}));
    })(ds);
  }
  wrap.appendChild(cal);
  drop.appendChild(wrap);
  main.appendChild(drop);

  /* painel do dia selecionado */
  renderDayPanel(main);
}

/* ação da linha: "Tirar" da escala (pede um segundo toque); dia já pago fica travado */
function renderRowAction(entry){
  var div=h("div",{class:"presence"});
  if(entry.paid){
    div.appendChild(h("button",{type:"button",class:"paid-lock",onclick:function(){
      toast("Esse dia já foi pago. Para tirar, desfaça o pagamento em \"A pagar\".");

/* corrige o valor ou a função só daquele dia */
function openEntryForm(entry){

  var roles=[""].concat(db.functions); if(cur&&roles.indexOf(cur)<0) roles.push(cur);
  roles.forEach(function(r){ iRole.appendChild(h("option",{value:r,text:r||"Sem função"})); });
  iRole.value=cur;
  var iValue=h("input",{type:"text",inputmode:"decimal",value:moneyInput(entry.value)});
  openSheet(firstName(nameOf(entry))+" em "+ddmm(entry.date),h("div",{class:"form"},
    h("div",{class:"field"},h("label",{text:"Função neste dia"}),iRole),
    h("div",{class:"field"},h("label",{text:"Valor deste dia (R$)"}),iValue),
    h("p",{class:"note",text:"Escalou no dia errado? Use o botão \"Tirar\" e escale no dia certo."}),
    h("button",{class:"btn primary block",type:"button",text:"Salvar correção",onclick:function(){
      var v=parseMoney(iValue.value);
      if(!(v>0)){ toast("Preencha o valor."); return; }
      syncDb();
      var e=db.entries.filter(function(x){return x.id===entry.id&&!x.paid;})[0];
      if(!e){ closeSheet(); render(); toast("Esse dia mudou. Confira."); return; }
      e.role=iRole.value; e.value=v;
      closeSheet(); commit("Corrigido.");
    }})));
}

/* escalar: marca quem vai trabalhar no dia. Quem já está escalado aparece marcado e travado;
   para tirar alguém, é o botão "Tirar" na linha da pessoa. */
function openAddToDay(){
  var day=ui.selDay;
  var already={};
  db.entries.forEach(function(e){ if(e.date===day) already[e.personId]=true; });
  var list=db.people.filter(function(p){return p.active!==false;})
    .sort(function(a,b){return a.name.localeCompare(b.name,"pt-BR");});
  if(list.length===0){
    toast("Cadastre pessoas primeiro na aba Pessoas.");
    return;
  }

  var checks=[];
  var body=h("div",{class:"form"});
  var pickList=h("div",{class:"pick-list"});
  list.forEach(function(p){
    var has=!!already[p.id];
    var cb=h("input",{type:"checkbox",checked:has,disabled:has});
    checks.push({person:p,cb:cb,has:has});
    pickList.appendChild(h("label",{class:"pick"},
      cb,
      h("div",{class:"person-info",style:"flex:1;"},
        h("b",{text:p.name}),
        h("span",{text:has?"Já está na escala":(p.role?p.role+" · ":"")+money(p.rate)})
      )
    ));
  });
  body.appendChild(pickList);
  body.appendChild(h("button",{class:"btn primary block",type:"button",text:"Confirmar",onclick:function(){
    var added=0;
    checks.forEach(function(c){
      if(c.cb.checked&&!c.has){
        var nid=day+"_"+c.person.id; flashLater("entry:"+nid);
        db.entries.push({
          id:nid, personId:c.person.id, date:day,
          role:c.person.role, value:c.person.rate,
          status:"escalado", paid:false, paidAt:null, createdAt:new Date().toISOString()
        });
        added++;
      }
    });
    if(!added){ toast("Selecione pelo menos uma pessoa."); return; }
    closeSheet(); commit(added+" pessoa"+(added>1?"s":"")+" escalada"+(added>1?"s":"")+".");
  }}));

  openSheet("Escalar para "+ddmm(day),body);
}

/* ================== ENVIAR ESCALA DA SEMANA ================== */
var flyerLogo=new Image(); flyerLogo.src="icon-512.png";
function weekEntries(start){
  var end=addDays(start,6);
  return db.entries.filter(function(e){ return e.date>=start&&e.date<=end&&person(e.personId); });
}
function personWeekMsg(p,entries,start,link){
  var lines=["Oi "+firstName(p.name)+"! Sua escala da semana ("+ddmm(start)+" a "+ddmm(addDays(start,6))+"):",""];
  entries.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(e){
    lines.push("- "+cap(WDL[fromIso(e.date).getDay()])+", "+ddmm(e.date)+(e.role?" ("+e.role+")":""));
  });
  if(link) lines.push("","Toque no link e confirme que recebeu:",link);
  lines.push("","———",BAR.nome);
  return lines.join("\n");
}
/* "assinatura" da escala enviada: se mudar dia ou função, o OK antigo não vale mais */
function weekSig(entries){
  return entries.map(function(e){return e.date+":"+(e.role||"");}).sort().join("|");
}
function lastSend(pid,start){
  return db.sends.filter(function(x){return x.personId===pid&&x.start===start;})
    .sort(function(a,b){return String(a.createdAt).localeCompare(String(b.createdAt));}).pop()||null;
}
function confirmOf(token){ return db.confirms.filter(function(c){return c.id===token;})[0]||null; }
function confirmedDay(entry){
  var start=weekRange(entry.date).start, x=lastSend(entry.personId,start);
  if(!x||!confirmOf(x.id)) return false;
  return x.sig.split("|").indexOf(entry.date+":"+(entry.role||""))>-1;
}
function newToken(){
  var a=new Uint8Array(16); crypto.getRandomValues(a);
  return Array.prototype.map.call(a,function(b){return ("0"+b.toString(16)).slice(-2);}).join("");
}
/* o link leva a escala dentro dele: o funcionário não precisa de senha nem vê outros dados */
function confirmLink(p,entries,start,token){
  var data={t:token,n:firstName(p.name),s:start,d:entries.map(function(e){return [e.date,e.role||""];}).sort()};
  var b=btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return new URL("confirmar.html",location.href.split("#")[0]).href+"#"+b;
}
function shareStatus(pid,start){
  var x=lastSend(pid,start);
  if(!x) return {text:"Ainda não enviado",cls:""};
  if(x.sig!==weekSig(weekEntries(start).filter(function(e){return e.personId===pid;})))
    return {text:"Escala mudou: envie de novo",cls:"pill warn"};
  var c=confirmOf(x.id);
  if(c){
    var d=new Date(c.at);
    return {text:"✓ Deu OK"+(isNaN(d)?"":" em "+ddmm(iso(d))+" "+pad(d.getHours())+":"+pad(d.getMinutes())),cls:"pill ok"};
  }
  return {text:"Enviado, aguardando OK",cls:"pill warn"};
}
/* atualiza a situação na janela aberta quando chega um OK pela nuvem */
function refreshShare(){
  var els=document.querySelectorAll("[data-share]");
  Array.prototype.forEach.call(els,function(el){
    var k=el.getAttribute("data-share").split("|"), st=shareStatus(k[0],k[1]);
    el.textContent=st.text; el.className=st.cls;
  });
}
/* imagem da escala para o grupo (sem valores) */
function drawFlyer(start){
  var all=weekEntries(start), W=1080, X=70, MAX=W-X*2-60;
  var c=document.createElement("canvas"), g=c.getContext("2d");
  var FD='"Bricolage Grotesque", sans-serif', FB='Figtree, sans-serif';
  g.font="500 40px "+FB;
  var days=[];
  for(var i=0;i<7;i++){
    var d=addDays(start,i);
    var names=all.filter(function(e){return e.date===d;}).map(function(e){
      return nameOf(e)+(e.role?" ("+e.role+")":"");
    }).sort(function(a,b){return a.localeCompare(b,"pt-BR");});
    if(!names.length) continue;
    var lines=[];
    names.forEach(function(n){
      var line="";
      n.split(" ").forEach(function(w){
        if(line&&g.measureText(line+" "+w).width>MAX){ lines.push(line); line=w; } else line=line?line+" "+w:w;
      });
      lines.push(line);
    });
    days.push({title:cap(WDL[fromIso(d).getDay()])+" · "+ddmm(d),lines:lines,h:110+lines.length*56});
  }
  var H=Math.max(1350,470+days.reduce(function(s,d){return s+d.h+28;},0)+130);
  c.width=W; c.height=H;
  g.fillStyle="#1f3b33"; g.fillRect(0,0,W,H);
  g.textAlign="center";
  if(flyerLogo.complete&&flyerLogo.naturalWidth){
    g.save(); g.beginPath(); g.arc(W/2,150,100,0,Math.PI*2); g.clip();
    g.drawImage(flyerLogo,W/2-100,50,200,200); g.restore();
  }
  g.fillStyle="#e3a72a"; g.font="800 72px "+FD; g.fillText("ESCALA DA SEMANA",W/2,345);
  g.fillStyle="#eef1ea"; g.font="600 40px "+FB; g.fillText(ddmm(start)+" a "+ddmm(addDays(start,6)),W/2,405);
  var y=460; g.textAlign="left";
  days.forEach(function(d){
    g.fillStyle="#ffffff"; g.beginPath();
    if(g.roundRect) g.roundRect(X,y,W-X*2,d.h,28); else g.rect(X,y,W-X*2,d.h);
    g.fill();
    g.fillStyle="#1f3b33"; g.font="800 44px "+FD; g.fillText(d.title,X+30,y+66);
    g.fillStyle="#18221e"; g.font="500 40px "+FB;
    d.lines.forEach(function(l,i){ g.fillText(l,X+30,y+132+i*56); });
    y+=d.h+28;
  });
  g.textAlign="center"; g.fillStyle="#a9bcb3"; g.font="600 34px "+FB;
  g.fillText(BAR.nome+"  ·  "+BAR.instagram,W/2,H-55);
  return c;
}
function shareFlyer(start){
  /* tudo sem espera: o iPhone só abre o compartilhar direto no toque */
  var bin=atob(drawFlyer(start).toDataURL("image/png").split(",")[1]);
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  var file=new File([bytes],"escala-"+start+".png",{type:"image/png"});
  function download(){
    var url=URL.createObjectURL(file);
    var a=h("a",{href:url,download:file.name});
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},60000);
    toast("Flyer baixado.");
  }
  var can=false;
  try{ can=!!(navigator.canShare&&navigator.canShare({files:[file]})); }catch(e){}
  if(!can){ download(); return; }
  navigator.share({files:[file]}).catch(function(err){ if(!err||err.name!=="AbortError") download(); });
}
function openWeekShare(start){
  var list=weekEntries(start), body=h("div",{class:"form"});
  body.appendChild(h("div",{class:"cal-nav"},
    h("button",{type:"button","aria-label":"Semana anterior",onclick:function(){ openWeekShare(addDays(start,-7)); }},icon("prev")),
    h("span",{class:"label",text:ddmm(start)+" a "+ddmm(addDays(start,6))}),
    h("button",{type:"button","aria-label":"Próxima semana",onclick:function(){ openWeekShare(addDays(start,7)); }},icon("next"))));
  if(!list.length){
    body.appendChild(h("div",{class:"empty"},h("b",{text:"Ninguém escalado nesta semana"})));
  } else {
    body.appendChild(h("button",{class:"btn primary block",type:"button",onclick:function(){ shareFlyer(start); }},
      icon("up"),h("span",{text:"Flyer para o grupo"})));
    body.appendChild(h("p",{class:"section-title",text:"Escala individual"}));
    var online=!!linkedUid();
    body.appendChild(h("p",{class:"note",text:online?"A mensagem leva um link para a pessoa dar o OK. Ele aparece aqui com este celular na internet."
      :"Para receber o OK dos funcionários, conecte este celular em Pessoas."}));
    var by=groupByPerson(list);
    sortedIds(by).forEach(function(pid){
      var p=person(pid), es=by[pid].entries, n=es.length, action;
      if(waNumber(p.phone)){
        var sig=weekSig(es), prev=lastSend(pid,start);
        var token=prev&&prev.sig===sig?prev.id:(online?newToken():"");
        var link=online?confirmLink(p,es,start,token):"";
        action=h("a",{class:"btn wa sm",target:"_blank",rel:"noopener",
          href:"https://wa.me/"+waNumber(p.phone)+"?text="+encodeURIComponent(personWeekMsg(p,es,start,link)),
          onclick:function(){
            action.classList.add("sent"); action.lastChild.textContent="Enviar de novo";
            if(!online||db.sends.some(function(x){return x.id===token;})) return;
            db.sends.push({id:token,personId:pid,start:start,sig:sig,createdAt:new Date().toISOString()});
            if(persist()) refreshShare();
          }},
          icon("wa"),h("span",{text:"Enviar"}));
      } else action=h("span",{class:"pill warn",text:"Sem WhatsApp"});
      var st=shareStatus(pid,start);
      body.appendChild(h("div",{class:"person-row"},
        h("div",{class:"person-info"},h("b",{text:p.name}),h("span",{text:n+" dia"+(n>1?"s":"")}),
          online?h("span",{"data-share":pid+"|"+start,class:st.cls,text:st.text}):null),action));
    });
  }
  openSheet("Escala da semana",body);
}

/* ================== A PAGAR ================== */
function groupByPerson(list){
  var by={};
  list.forEach(function(e){
    if(!by[e.personId]) by[e.personId]={entries:[],total:0};
    by[e.personId].entries.push(e);
    by[e.personId].total+=(+e.value||0);
  });
  Object.keys(by).forEach(function(k){
    by[k].entries.sort(function(a,b){return a.date<b.date?-1:1;});
  });
  return by;
}
function sortedIds(by){
  return Object.keys(by).sort(function(a,b){
    var pa=person(a),pb=person(b);
    return (pa?pa.name:"ZZZ").localeCompare(pb?pb.name:"ZZZ","pt-BR");
  });
}
function sumVal(list){ return list.reduce(function(s,e){return s+(+e.value||0);},0); }

/* quinzena que precisa de atenção: a mais antiga com dia sem pagar; sem pendência, a atual. "A pagar" e Resumo abrem nela (o resumo que ela manda é o
   da quinzena que vai pagar, não o da que acabou de começar). */
function pendingQuinzena(){
  var t=today();
  var oldest=db.entries.reduce(function(m,e){
    return counts(e)&&!e.paid&&(!m||e.date<m)?e.date:m;
  },null);
  return quinzena(oldest&&oldest<t?oldest:t);
}

function renderPagar(){
  var main=$("#main"); main.textContent="";
  addChild(main,header("A pagar"));

  var worked=db.entries.filter(counts);
  var pendingAll=worked.filter(function(e){return !e.paid;});

  /* quinzena exibida: a escolhida, ou a que precisa de atenção (pendingQuinzena).
     Fica fixa enquanto ela estiver na aba, para a tela não pular no meio de um toque. */
  var q;
  if(ui.payAnchor) q=quinzena(ui.payAnchor);
  else { q=pendingQuinzena(); ui.payAnchor=q.start; }

  /* navegação entre quinzenas */
  main.appendChild(h("div",{class:"cal-nav q-nav"},
    h("button",{type:"button","aria-label":"Quinzena anterior",onclick:function(){
      ui.payAnchor=prevQuinzena(q).start; render();
    }},icon("prev")),
    h("div",{class:"label"},
      h("div",{text:q.label}),
      h("small",{text:q.range})
    ),
    h("button",{type:"button","aria-label":"Próxima quinzena",onclick:function(){
      ui.payAnchor=nextQuinzena(q).start; render();
    }},icon("next"))
  ));

  /* aviso de pendência em quinzenas anteriores */
  var before=pendingAll.filter(function(e){return e.date<q.start;});
  if(before.length>0){
    var oldestQ=quinzena(before.reduce(function(m,e){return e.date<m?e.date:m;},before[0].date));
    main.appendChild(h("div",{class:"notice"},
      h("span",{text:"Tem "+money(netOpen(before,prevQuinzena(q)))+" sem pagar de quinzena anterior."}),
      h("button",{class:"btn sm",type:"button",text:"Ver",onclick:function(){
        ui.payAnchor=oldestQ.start; render();
      }})
    ));
  }

  var qWorked=worked.filter(function(e){return inQ(e,q);});
  var qPending=qWorked.filter(function(e){return !e.paid;});
  var qPaid=qWorked.filter(function(e){return e.paid;});

  if(qWorked.length===0){
    main.appendChild(h("div",{class:"empty"},
      h("b",{text:"Ninguém para pagar nesta quinzena"}),
      h("span",{text:"Quem você escala na aba Escala aparece aqui."})
    ));
    return;
  }

  main.appendChild(h("div",{class:"totals"},
    h("div",{class:"total-card hl"},
      h("div",{class:"lbl",text:"Falta pagar"}),
      h("div",{class:"val",text:money(netOpen(qPending,q))})
    ),
    flashIf(h("div",{class:"total-card"},
      h("div",{class:"lbl",text:"Já pago"}),
      h("div",{class:"val",text:money(sumVal(qPaid)-offVal(db.discounts.filter(function(x){
        return x.paid&&x.appliedQ===q.start;
      })))})
    ),"total-paid")
  ));

  main.appendChild(h("button",{class:"btn primary block",type:"button",style:"margin-bottom:12px;",
    onclick:function(){ openClosing(q.start); }},icon("check"),h("span",{text:"Fechamento da quinzena"})));

  /* pendentes */
  if(qPending.length===0){
    main.appendChild(h("div",{class:"empty",style:"padding:18px 16px;"},
      h("b",{text:"Quinzena paga!"}),
      h("span",{text:"Todo mundo desta quinzena já recebeu."})
    ));
  } else {
    var byP=groupByPerson(qPending);
    var list=h("div");

      var info=byP[pid], p=person(pid);
      var pName=p?p.name:"Removido", pPix=p?p.pix:"";
      var n=info.entries.length;
      var disc=openDiscounts(pid,q), off=offVal(disc), due=Math.max(0,info.total-off);
      var row=h("div",{class:"pay-row"},
        h("span",{class:"avatar",text:initials(pName)}),
        h("div",{class:"pay-info"},
          h("b",{text:pName}),
          h("span",{text:n+" dia"+(n>1?"s":"")+" · "+info.entries.map(function(e){return ddmm(e.date);}).join(", ")}),
          disc.length?h("span",{style:"display:block;",text:"Diárias "+money(info.total)+
            [[true," · bônus +"],[false," · descontos -"]].map(function(t){
              var v=sumVal(disc.filter(function(x){return isBonus(x)===t[0];}));
              return v?t[1]+money(v):"";
            }).join("")}):null
        ),
        h("span",{class:"pay-val",text:money(due)})
      );
      var actions=h("div",{class:"pay-actions"});
      if(pPix){
        actions.appendChild(h("button",{class:"btn sm",type:"button",onclick:function(){
          copyText(pPix,"Pix copiado!");
        }},icon("copy"),h("span",{text:"Copiar Pix"})));
      }
      actions.appendChild(h("button",{class:"btn ok sm",type:"button",onclick:function(){
        openPaySheet(pName,info.entries,disc,q);
      }},icon("check"),h("span",{text:"Paguei "+money(due)})));
      row.appendChild(actions);
      list.appendChild(row);
    });
    main.appendChild(list);
  }

  /* já pagos (com desfazer) */
  if(qPaid.length>0){
    main.appendChild(h("div",{class:"section-title",text:"Já pagos nesta quinzena"}));
    var byPaid=groupByPerson(qPaid);
    var plist=h("div");
    sortedIds(byPaid).forEach(function(pid){
      var info=byPaid[pid], p=person(pid);
      var pName=p?p.name:"Removido";
      var n=info.entries.length;
      var last=info.entries.reduce(function(m,e){return e.paidAt&&e.paidAt>m?e.paidAt:m;},"");
      var when=last?" · pago "+ddmm(iso(new Date(last))):"";
      var row=flashIf(h("div",{class:"pay-row paid"},

        h("span",{class:"pay-val",text:money(info.total-offVal(qDiscounts(pid,q,info.entries).filter(function(x){return x.paid;})))})
      ),"paid:"+pid);

      actions.appendChild(confirmBtn("Desfazer","Confirmar?","sm danger",function(){
        info.entries.forEach(function(e){e.paid=false;e.paidAt=null;});

          if(x.personId===pid&&x.paid&&x.appliedQ===q.start){ x.paid=false; x.paidAt=null; x.appliedQ=null; }
        });

      }));
      actions.appendChild(h("button",{class:"btn sm",type:"button",onclick:function(){
        /* o holerite leva a quinzena inteira da pessoa, inclusive o que ainda falta */
        emitPayslips([pid],groupByPerson(qWorked),q);

      row.appendChild(actions);
      plist.appendChild(row);
    });
    main.appendChild(plist);
  }
}

/* ================== FECHAMENTO ================== */
function markPaid(entries,discounts,q){
  var ids={}, dids={}, now=new Date().toISOString();
  entries.forEach(function(e){ ids[e.id]=true; });
  discounts.forEach(function(x){ dids[x.id]=true; });
  db.entries.forEach(function(e){ if(ids[e.id]&&!e.paid){ e.paid=true; e.paidAt=now; } });
  db.discounts.forEach(function(x){ if(dids[x.id]&&!x.paid){ x.paid=true; x.paidAt=now; x.appliedQ=q.start; } });
}
function closingData(pid,q){
  var all=db.entries.filter(function(e){return e.personId===pid&&counts(e)&&inQ(e,q);});
  var pend=all.filter(function(e){return !e.paid;});
  var disc=qDiscounts(pid,q,all);
  var total=Math.round((sumVal(all)-offVal(disc))*100)/100;
  var due=Math.round((sumVal(pend)-offVal(disc.filter(function(x){return !x.paid;})))*100)/100;
  return {all:all,pend:pend,disc:disc,total:total,due:due};
}
function payMsg(p,d,q){
  var lines=["Oi "+firstName(p.name)+"! Seu pagamento de "+ddmm(q.start)+" a "+ddmm(q.end)+":",""];
  d.all.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(e){
    lines.push("- "+ddmm(e.date)+" diária: "+money(e.value));
  });
  d.disc.forEach(function(x){ lines.push("- "+ddmm(x.date)+" "+x.reason+": "+signed(x)); });
  lines.push("","*Total da quinzena: "+money(d.total)+"*");
  if(!d.pend.length) lines.push("Situação: pago.");
  else {
    if(d.due!==d.total) lines.push("Já pago: "+money(d.total-d.due));
    lines.push("*A receber: "+money(d.due)+"*");
  }
  lines.push("","———",BAR.nome);
  return lines.join("\n");
}
function openClosing(start){
  var q=quinzena(start);
  var worked=db.entries.filter(function(e){return counts(e)&&inQ(e,q);});
  var by=groupByPerson(worked), ids=sortedIds(by), body=h("div",{class:"form"});
  var data={}, due=0, payable=[];
  ids.forEach(function(pid){
    var d=data[pid]=closingData(pid,q);
    if(d.pend.length){ due+=Math.max(0,d.due); if(d.due>=0) payable.push(pid); }
  });
  body.appendChild(h("p",{class:"note",text:q.label+" · falta pagar "+money(due)}));
  if(q.end>today()) body.appendChild(h("div",{class:"notice"},h("span",{text:"A quinzena ainda não terminou: os valores são parciais."})));
  body.appendChild(h("p",{class:"note",text:"1) Pague e toque em Paguei. 2) Envie o valor no WhatsApp. 3) Toque em Holerite e escolha a conversa da pessoa."}));
  function pay(list){
    syncDb();
    list.forEach(function(pid){
      var d=closingData(pid,q);
      if(d.pend.length&&d.due>=0) markPaid(d.pend,openDiscounts(pid,q),q);
    });
    closeSheet(); commit("Pagamento registrado!"); openClosing(start);
  }
  ids.forEach(function(pid){
    var d=data[pid], p=person(pid)||{name:"Removido"};
    var actions=h("div",{class:"pay-actions"});
    if(d.pend.length){
      if(p.pix) actions.appendChild(h("button",{class:"btn sm",type:"button",onclick:function(){ copyText(p.pix,"Pix copiado!"); }},icon("copy"),h("span",{text:"Copiar Pix"})));
      if(d.due>=0) actions.appendChild(confirmBtn("Paguei","Confirmar "+money(d.due)+"?","ok sm",function(){ pay([pid]); }));
    }
    if(waNumber(p.phone)) actions.appendChild(h("a",{class:"btn wa sm",target:"_blank",rel:"noopener",
      href:"https://wa.me/"+waNumber(p.phone)+"?text="+encodeURIComponent(payMsg(p,d,q))},icon("wa"),h("span",{text:"Enviar valor"})));
    else actions.appendChild(h("span",{class:"pill warn",text:"Sem WhatsApp"}));
    actions.appendChild(h("button",{class:"btn sm",type:"button",onclick:function(){ emitPayslips([pid],by,q); }},icon("down"),h("span",{text:"Holerite"})));
    body.appendChild(h("div",{class:"pay-row"+(d.pend.length?"":" paid")},
      h("span",{class:"avatar",text:initials(p.name)}),
      h("div",{class:"pay-info"},h("b",{text:p.name}),
        h("span",{text:!d.pend.length?"Pago":d.due<0?"Desconto maior que o valor: corrija em Extras":"A receber"})),
      h("span",{class:"pay-val",text:money(d.pend.length?d.due:d.total)}),
      actions));
  });
  if(payable.length>1) body.appendChild(confirmBtn("Marcar todos como pagos","Já pagou todos? Confirmar","ok block",function(){ pay(payable); }));
  if(ids.length) body.appendChild(h("button",{class:"btn block",type:"button",onclick:function(){ emitPayslips(ids,by,q); }},
    icon("down"),h("span",{text:"Holerites de todos (PDF)"})));
  else body.appendChild(h("div",{class:"empty"},h("b",{text:"Ninguém para pagar nesta quinzena"})));
  openSheet("Fechamento",body);
}

/* "Paguei": confirma os dias antes de marcar como pago.
   Um toque a mais, mas um toque repetido não marca a pessoa de baixo,
   e dá para registrar só parte quando ela não consegue pagar tudo. */
function openPaySheet(pName,entries,discounts,q){
  var body=h("div",{class:"form"});
  body.appendChild(h("p",{class:"note",text:"Desmarque o dia que ainda não pagou"+
    (discounts.length?" ou o desconto/bônus que vai ficar para depois.":".")}));
  var checks=[];
  var list=h("div",{class:"pick-list"});
  function item(x,isDisc){
    var cb=h("input",{type:"checkbox",checked:true,onchange:update});
    checks.push({id:x.id,value:+x.value||0,cb:cb,disc:isDisc,bonus:isDisc&&isBonus(x)});
    list.appendChild(h("label",{class:"pick"},cb,
      h("span",{style:"flex:1;font-weight:600;",text:isDisc?x.reason+", "+ddmm(x.date)
        :WD[fromIso(x.date).getDay()]+", "+ddmm(x.date)}),
      h("span",{class:"pay-val",text:isDisc?signed(x):money(x.value)})
    ));
  }
  entries.forEach(function(e){ item(e,false); });
  discounts.forEach(function(x){ item(x,true); });
  body.appendChild(list);
  var btn=h("button",{class:"btn primary block",type:"button",onclick:function(){
    var ids={}, dids={}, n=0;
    checks.forEach(function(c){ if(c.cb.checked){ if(c.disc) dids[c.id]=true; else { ids[c.id]=true; n++; } } });
    if(!n) return;
    var now=new Date().toISOString();
    /* procura pelo id: os dados podem ter sido recarregados com a janela aberta */
    db.entries.forEach(function(e){
      if(ids[e.id]&&!e.paid){ e.paid=true; e.paidAt=now; }
    });
    db.discounts.forEach(function(x){
      if(dids[x.id]&&!x.paid){ x.paid=true; x.paidAt=now; x.appliedQ=q.start; }
    });
    flashLater("paid:"+entries[0].personId); flashLater("total-paid");
    closeSheet(); commit("Pagamento de "+firstName(pName)+" registrado!");
  }});
  function update(){
    var total=0, n=0;
    checks.forEach(function(c){ if(c.cb.checked){ total+=c.disc&&!c.bonus?-c.value:c.value; if(!c.disc) n++; } });
    total=Math.round(total*100)/100;
    btn.disabled=!n||total<0;
    btn.textContent=!n?"Nenhum dia marcado":total<0?"Desconto maior que as diárias":"Confirmar "+money(total);
  }
  update();
  body.appendChild(btn);
  openSheet("Pagamento de "+firstName(pName),body);
}

/* ================== DESCONTOS ================== */
/* cada lançamento é um desconto ou, com kind "bonus", uma bonificação */
function isBonus(x){ return x.kind==="bonus"; }
function signed(x){ return (isBonus(x)?"+":"-")+money(x.value); }
/* quanto sai do total: descontos menos bonificações (negativo = a pessoa recebe a mais) */
function offVal(list){ return list.reduce(function(s,x){ return s+(isBonus(x)?-1:1)*(+x.value||0); },0); }
/* descontos que entram no acerto de uma pessoa numa quinzena: os já abatidos nela e, se ainda
   há diária a pagar, os pendentes até o fim dela (o que sobrou de antes também entra) */
function qDiscounts(pid,q,entries){
  var open=entries.some(function(e){return !e.paid;});
  return db.discounts.filter(function(x){
    return x.personId===pid&&(x.paid?x.appliedQ===q.start:open&&x.date<=q.end);
  }).sort(function(a,b){return a.date<b.date?-1:1;});
}
function openDiscounts(pid,q){
  return db.discounts.filter(function(x){return x.personId===pid&&!x.paid&&x.date<=q.end;})
    .sort(function(a,b){return a.date<b.date?-1:1;});
}
/* o que falta pagar de uma lista de diárias pendentes, já com os descontos (nunca negativo) */
function netOpen(entries,q){
  var by=groupByPerson(entries);
  return Object.keys(by).reduce(function(s,pid){
    return s+Math.max(0,by[pid].total-offVal(openDiscounts(pid,q)));
  },0);
}
function renderDescontos(){
  var main=$("#main"); main.textContent="";
  addChild(main,header("Descontos e bônus",
    h("button",{class:"btn primary",type:"button",onclick:function(){ openDiscountForm(null); }},icon("plus"),h("span",{text:"Novo"}))));
  if(!ui.descAnchor) ui.descAnchor=today();
  var q=quinzena(ui.descAnchor);
  main.appendChild(h("div",{class:"cal-nav q-nav"},
    h("button",{type:"button","aria-label":"Quinzena anterior",onclick:function(){ ui.descAnchor=prevQuinzena(q).start; render(); }},icon("prev")),
    h("div",{class:"label"},h("div",{text:q.label}),h("small",{text:q.range})),
    h("button",{type:"button","aria-label":"Próxima quinzena",onclick:function(){ ui.descAnchor=nextQuinzena(q).start; render(); }},icon("next"))
  ));
  var list=db.discounts.filter(function(x){return inQ(x,q);}).sort(function(a,b){return a.date<b.date?-1:1;});
  var older=db.discounts.filter(function(x){return !x.paid&&x.date<q.start;});
  if(older.length){
    main.appendChild(h("div",{class:"notice"},
      h("span",{text:older.length+(older.length>1?" lançamentos anteriores ainda não acertados.":" lançamento anterior ainda não acertado.")}),
      h("button",{class:"btn sm",type:"button",text:"Ver",onclick:function(){ ui.descAnchor=older.reduce(function(m,x){return x.date<m?x.date:m;},older[0].date); render(); }})));
  }
  if(!list.length){
    main.appendChild(h("div",{class:"empty"},h("b",{text:"Nenhum lançamento nesta quinzena"}),
      h("span",{text:"Toque em \"Novo\" para lançar um desconto ou uma bonificação."})));
    return;
  }
  function card(label,items){ return h("div",{class:"total-card"},
    h("div",{class:"lbl",text:label}),h("div",{class:"val",text:money(sumVal(items))})); }
  main.appendChild(h("div",{class:"totals"},
    card("Bonificações",list.filter(isBonus)),
    card("Descontos",list.filter(function(x){return !isBonus(x);}))));
  list.forEach(function(x){
    var name=nameOf(x);
    var row=h("div",{class:"person-row"},
      h("span",{class:"avatar",text:initials(name)}),
      h("div",{class:"person-info"},h("b",{text:name}),
        h("span",{text:ddmm(x.date)+" · "+x.reason+" · "+signed(x)})),
      x.paid?h("span",{class:"pill ok",text:"Acertado"})
        :h("div",{class:"presence"},
          h("button",{class:"btn sm",type:"button",onclick:function(){ openDiscountForm(x); }},icon("edit"),h("span",{text:"Editar"})),
          confirmBtn("Excluir","Excluir?","sm danger",function(){
            db.discounts=db.discounts.filter(function(y){ return !(y.id===x.id&&!y.paid); });
            commit("Lançamento excluído.");
          })));
    main.appendChild(row);
  });
}
function openDiscountForm(old){
  var people=db.people.slice().sort(function(a,b){return a.name.localeCompare(b.name,"pt-BR");});
  if(!people.length){ toast("Cadastre pessoas primeiro na aba Pessoas."); return; }

/* ================== RESUMO ================== */
/* período do resumo conforme o modo escolhido (quinzena = padrão) */
function sumRange(){
  if(ui.sumMode==="semana"){
    var wr=weekRange(ui.sumAnchor);
    return {start:wr.start,end:wr.end,
      titulo:"Semana de "+ddmm(wr.start)+" a "+ddmm(wr.end),
      label:ddmm(wr.start)+" a "+ddmm(wr.end), sub:"segunda a domingo", palavra:"semana"};
  }
  var q=quinzena(ui.sumAnchor);
  return {start:q.start,end:q.end,
    titulo:cap(q.label), label:cap(q.label), sub:q.range, palavra:"quinzena"};
}
function sumStep(dir){
  if(ui.sumMode==="semana"){ ui.sumAnchor=addDays(ui.sumAnchor,dir*7); return; }
  var q=quinzena(ui.sumAnchor);
  ui.sumAnchor=(dir<0?prevQuinzena(q):nextQuinzena(q)).start;
}
/* controle de quem já recebeu o resumo do período aberto.
   Guarda só o período atual, para não acumular lixo no aparelho. */
var SENT_KEY=KEY+".sent";
function periodKey(r){ return ui.sumMode+":"+r.start; }
function sentIds(r){
  try{
    var s=JSON.parse(localStorage.getItem(SENT_KEY)||"{}");
    return s.k===periodKey(r)&&Array.isArray(s.ids)?s.ids:[];
  }catch(e){ return []; }
}
function saveSent(r,ids){
  try{ localStorage.setItem(SENT_KEY,JSON.stringify({k:periodKey(r),ids:ids})); }catch(e){}
}
function markSent(r,pid){
  var ids=sentIds(r);
  if(ids.indexOf(pid)<0){ ids.push(pid); saveSent(r,ids); }
}
function periodDiscounts(pid,r,entries){
  if(ui.sumMode==="quinzena") return qDiscounts(pid,quinzena(r.start),entries);
  return db.discounts.filter(function(x){return x.personId===pid&&x.date>=r.start&&x.date<=r.end;});
}
function waLink(p,info,r){
  return "https://wa.me/"+waNumber(p.phone)+"?text="+encodeURIComponent(buildSummaryMsg(p,info,r));
}

function setSumMode(m){
  ui.sumMode=m;
  try{localStorage.setItem(KEY+".sumMode",m);}catch(e){}
  ui.sumAnchor=null;
  render();
}

function renderResumo(){
  var main=$("#main"); main.textContent="";
  addChild(main,header("Resumo"));

  /* quinzena: abre na mesma de "A pagar"; semana: na semana atual */
  if(!ui.sumAnchor) ui.sumAnchor=ui.sumMode==="quinzena"?pendingQuinzena().start:today();

  /* escolha do período: quinzena (padrão) ou semana */
  var modes=h("div",{class:"chips seg"});
  [["quinzena","Quinzena"],["semana","Semana"]].forEach(function(m){
    var c=h("button",{class:"chip"+(ui.sumMode===m[0]?" active":""),type:"button",
      onclick:function(){ if(ui.sumMode!==m[0]) setSumMode(m[0]); }},h("span",{text:m[1]}));
    modes.appendChild(c);
  });
  main.appendChild(modes);

  var r=sumRange();
  main.appendChild(h("div",{class:"cal-nav q-nav"},
    h("button",{type:"button","aria-label":"Período anterior",onclick:function(){
      sumStep(-1); render();
    }},icon("prev")),
    h("div",{class:"label"},
      h("div",{text:r.label}),
      r.sub?h("small",{text:r.sub}):null
    ),
    h("button",{type:"button","aria-label":"Próximo período",onclick:function(){
      sumStep(1); render();
    }},icon("next"))
  ));

  /* quem trabalhou no período */
  var periodEntries=db.entries.filter(function(e){
    return e.date>=r.start&&e.date<=r.end&&counts(e);
  });

  if(periodEntries.length===0){
    main.appendChild(h("div",{class:"empty"},
      h("b",{text:"Nenhum registro nesta "+r.palavra}),
      h("span",{text:"Marque presença na aba Escala."})
    ));
    return;
  }

  var byPerson=groupByPerson(periodEntries);

  /* fila de envio: o celular só deixa abrir um WhatsApp por toque,
     então manda um de cada vez e lembra quem já recebeu */
  var ordem=sortedIds(byPerson);
  var comWa=ordem.filter(function(pid){
    var p=person(pid); return p&&waNumber(p.phone);
  });
  var jaEnviados=sentIds(r).filter(function(pid){ return comWa.indexOf(pid)>-1; });
  var falta=comWa.filter(function(pid){ return jaEnviados.indexOf(pid)<0; });

  if(comWa.length>1){
    var fila=h("div",{style:"margin-bottom:10px;"});
    if(falta.length>0){
      var prox=person(falta[0]);

/* ================== SINCRONIZAR CELULARES (Firebase) ================== */
/* O celular continua guardando tudo nele (funciona sem internet). Cada alteração entra numa
   fila que é enviada para a nuvem; o que chega da nuvem atualiza a tela na hora.
   A configuração fica no arquivo firebase-config.js. */
var FB_VER="10.12.2", FB_URL="https://www.gstatic.com/firebasejs/"+FB_VER+"/";
var LINK_KEY=KEY+".nuvem", QUEUE_KEY=KEY+".fila";
var cloud={ cfg:window.FIREBASE_CONFIG||null, fs:null, au:null, store:null, auth:null,
  user:null, ready:false, loading:false, error:"", snap:{}, stops:[], sending:{}, linking:false };

function linkedUid(){ try{ return localStorage.getItem(LINK_KEY); }catch(e){ return null; } }
function readQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]"); }catch(e){ return []; } }
function writeQueue(q){ localStorage.setItem(QUEUE_KEY,JSON.stringify(q)); }

/* compara o antes e o depois e transforma em alterações pequenas, registro por registro:
   assim dois celulares mexendo em coisas diferentes não apagam o trabalho um do outro */
function diffDb(a,b){
  var ops=[];
  ["people","entries","discounts","sends"].forEach(function(c){
    var old={};
    (a[c]||[]).forEach(function(x){ old[x.id]=x; });
    (b[c]||[]).forEach(function(x){
      var o=old[x.id]; delete old[x.id];
      if(!o){
        var d=Object.assign({},x);
        /* dia novo não leva "não pago": nunca desfaz um pagamento feito em outro celular */
        if(c==="entries"&&!d.paid){ delete d.paid; delete d.paidAt; }
        ops.push({c:c,id:x.id,t:"set",d:d}); return;
      }
      var ch={}, n=0;
      Object.keys(x).forEach(function(k){
        if(JSON.stringify(x[k])!==JSON.stringify(o[k])){ ch[k]=x[k]===undefined?null:x[k]; n++; }
      });
      if(n) ops.push({c:c,id:x.id,t:"upd",d:ch});
    });
    Object.keys(old).forEach(function(id){ ops.push({c:c,id:id,t:"del"}); });
  });
  if(JSON.stringify(a.functions||[])!==JSON.stringify(b.functions||[]))
    ops.push({c:"config",id:"geral",t:"set",d:{functions:b.functions||[]}});
  return ops;
}
function addToQueue(ops){
  var q=readQueue();
  ops.forEach(function(o){ o.n=uid(); q.push(o); });
  writeQueue(q);
}
function cloudQueue(beforeJson,after){
  if(!linkedUid()) return;
  var before=null;
  try{ before=JSON.parse(beforeJson||"null"); }catch(e){}
  var ops=diffDb(before||emptyDb(),after);
  if(!ops.length) return;
  addToQueue(ops); cloudFlush();
}
function cloudFlush(){
  if(!cloud.ready||!cloud.user||linkedUid()!==cloud.user.uid) return;
  var f=cloud.fs;
  readQueue().forEach(function(op){
    if(cloud.sending[op.n]) return;
    cloud.sending[op.n]=true;
    var ref=f.doc(cloud.store,op.c,op.id);
    var p=op.t==="del"?f.deleteDoc(ref):op.t==="upd"?f.updateDoc(ref,op.d):f.setDoc(ref,op.d,{merge:true});
    p.then(function(){ done(); },function(err){
      /* alterar algo que outro celular já tirou: não há o que enviar */
      if(err&&err.code==="not-found") return done();
      delete cloud.sending[op.n];
      cloud.error="A nuvem recusou o envio. Confira as regras do Firebase."; cloudRefresh();
    });
    function done(){
      writeQueue(readQueue().filter(function(x){ return x.n!==op.n; }));
      delete cloud.sending[op.n]; cloudRefresh();
    }
  });
}
/* dados da nuvem + o que ainda está na fila deste celular */
function cloudData(){
  var out={};
  ["people","entries","discounts","sends","confirms"].forEach(function(c){
    var m={};
    cloud.snap[c].forEach(function(x){ m[x.id]=Object.assign({},x.data,{id:x.id}); });
    out[c]=m;
  });
  var cfg=cloud.snap.config.filter(function(x){ return x.id==="geral"; })[0];
  out.functions=cfg&&cfg.data.functions||[];
  readQueue().forEach(function(op){
    if(op.c==="config"){ out.functions=op.d.functions; return; }
    var m=out[op.c];
    if(op.t==="del") delete m[op.id];
    else if(op.t==="set") m[op.id]=Object.assign({},m[op.id],op.d);
    else if(m[op.id]) m[op.id]=Object.assign({},m[op.id],op.d);
  });
  function list(m){
    return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a,b){
      return String(a.createdAt||"").localeCompare(String(b.createdAt||""));
    });
  }
  var entries=list(out.entries);
  entries.forEach(function(e){ e.paid=!!e.paid; e.paidAt=e.paidAt||null; });
  var discounts=list(out.discounts);
  discounts.forEach(function(x){ x.paid=!!x.paid; x.paidAt=x.paidAt||null; x.appliedQ=x.appliedQ||null; });
  return normalizeDb({people:list(out.people),entries:entries,discounts:discounts,sends:list(out.sends),confirms:list(out.confirms),functions:out.functions.slice()});
}
function snapshotsReady(){ return !!(cloud.snap.people&&cloud.snap.entries&&cloud.snap.discounts&&cloud.snap.sends&&cloud.snap.confirms&&cloud.snap.config); }
function cloudApply(){
  if(!snapshotsReady()||!cloud.user) return;
  if(!linkedUid()){ cloudLink(); return; }
  if(linkedUid()!==cloud.user.uid||dbLocked) return;
  syncDb();
  var data=cloudData();
  var next={people:data.people,entries:data.entries,discounts:data.discounts,sends:data.sends,confirms:data.confirms,functions:data.functions,settings:db.settings};
  var s=JSON.stringify(next);
  if(s!==JSON.stringify(db)){
    try{ localStorage.setItem(KEY,s); savedJson=s; }catch(e){ toast("Sem espaço para salvar. Libere espaço no aparelho."); return; }
    db=next; render(); refreshShare();
  }
  cloudFlush();
}
/* primeira conexão deste celular */
function cloudLink(){
  if(cloud.linking) return;
  cloud.linking=true;
  syncDb();
  var cloudEmpty=!cloud.snap.people.length&&!cloud.snap.entries.length;
  var localHas=db.people.length||db.entries.length;
  if(!cloudEmpty&&localHas){
    if(!confirm("A nuvem já tem dados ("+cloud.snap.people.length+" pessoas).\n\n"+
        "Os dados DESTE celular ("+db.people.length+" pessoas) serão trocados pelos da nuvem.\n\nContinuar?")){
      cloud.linking=false; cloudLogout(); return;
    }
  }
  try{
    if(!cloudEmpty&&localHas) localStorage.setItem(KEY+".antes-da-nuvem",JSON.stringify(db));
    writeQueue(cloudEmpty?diffDb(emptyDb(),db).map(function(o){ o.n=uid(); return o; }):[]);
    localStorage.setItem(LINK_KEY,cloud.user.uid);
  }catch(e){ cloud.linking=false; toast("Sem espaço para salvar. Libere espaço no aparelho."); return; }
  cloud.linking=false;
  cloudApply(); render(); toast("Celular conectado!");
}
function stopListening(){ cloud.stops.forEach(function(f){ f(); }); cloud.stops=[]; cloud.snap={}; }
function startListening(){
  stopListening();
  ["people","entries","discounts","sends","confirms","config"].forEach(function(c){
    cloud.stops.push(cloud.fs.onSnapshot(cloud.fs.collection(cloud.store,c),{includeMetadataChanges:true},function(q){
      /* só vale o que veio do servidor: uma cópia vazia sem internet não apaga nada */
      if(q.metadata.fromCache) return;
      cloud.error="";
      cloud.snap[c]=q.docs.map(function(d){ return {id:d.id,data:d.data()}; });
      cloudApply(); cloudRefresh();
    },function(){
      cloud.error="Sem permissão para ler a nuvem. Confira o e-mail e as regras do Firebase."; cloudRefresh();
    }));
  });
}
function cloudStart(){
  if(!cloud.cfg||cloud.ready||cloud.loading) return;
  cloud.loading=true;
  Promise.all([import(FB_URL+"firebase-app.js"),import(FB_URL+"firebase-auth.js"),import(FB_URL+"firebase-firestore.js")])
  .then(function(m){
    var app=m[0].initializeApp(cloud.cfg);
    cloud.au=m[1]; cloud.fs=m[2];
    cloud.auth=cloud.au.getAuth(app); cloud.store=cloud.fs.getFirestore(app);
    cloud.ready=true; cloud.loading=false; cloud.error="";
    cloud.au.onAuthStateChanged(cloud.auth,function(user){
      cloud.user=user; cloud.sending={};
      if(user) startListening(); else stopListening();
      cloudRefresh();
    });
  }).catch(function(){ cloud.loading=false; cloudRefresh(); });
}
function cloudLogout(){
  try{ localStorage.removeItem(LINK_KEY); localStorage.removeItem(QUEUE_KEY); }catch(e){}
  stopListening(); cloud.sending={};
  if(cloud.ready) cloud.au.signOut(cloud.auth);
  render();
}
function cloudStatus(){
  if(cloud.error) return cloud.error;
  if(!linkedUid()) return cloud.user?"Conectando...":"Este celular não está conectado.";
  var n=readQueue().length;
  if(!navigator.onLine) return "Sem internet. "+(n?n+" alteração(ões) serão enviadas quando voltar.":"Atualiza quando a internet voltar.");
  if(cloud.ready&&!cloud.user) return "Entre de novo para continuar sincronizando.";
  if(n) return "Enviando "+n+" alteração(ões)...";
  return snapshotsReady()?"Conectado. Os celulares estão sincronizados.":"Conectando...";
}
function cloudRefresh(){
  var el=document.getElementById("cloud-status");
  if(!el) return;
  if(ui.tab==="pessoas"&&!document.querySelector(".scrim")) render(); else el.textContent=cloudStatus();
}
function renderCloud(main){
  addChild(main,h("p",{class:"section-title",text:"Sincronizar celulares",style:"margin-top:28px;"}));

/* ================== HOLERITE (PDF) ================== */
function ddmmaaaa(s){ return ddmm(s)+"/"+s.slice(0,4); }
/* valor por extenso, até 999.999,99 */
function extenso(v){
  var U=["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
  var D=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
  var C=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
  function tres(n){
    if(n===100) return "cem";
    var p=[], r=n%100;
    if(n>=100) p.push(C[Math.floor(n/100)]);
    if(r){ if(r<20) p.push(U[r]); else { p.push(D[Math.floor(r/10)]); if(r%10) p.push(U[r%10]); } }
    return p.join(" e ");
  }
  var cents=Math.round(v*100), i=Math.floor(cents/100), c=cents%100, out=[];
  if(i){
    var mil=Math.floor(i/1000), resto=i%1000, t="";
    if(mil) t=mil===1?"mil":tres(mil)+" mil";
    if(resto) t+=(t?(resto<100||resto%100===0?" e ":" "):"")+tres(resto);
    out.push(t+(i===1?" real":" reais"));
  }
  if(c) out.push(tres(c)+(c===1?" centavo":" centavos"));
  return out.join(" e ")||"zero reais";
}
/* gerador de PDF simples (A4, fonte Helvetica), sem depender de internet */
function pdfEsc(s){
  return String(s).replace(/—|–/g,"-").replace(/[^\x20-\xff]/g,"?").replace(/[\\()]/g,"\\$&");
}
function textWidth(s,size){
  var w=0;
  for(var i=0;i<s.length;i++){
    var c=s.charAt(i);
    w+=/[0-9$]/.test(c)?556:/[ ., \/]/.test(c)?278:c==="R"?722:556;
  }
  return w*size/1000;
}
function wrapText(s,max){
  var out=[], line="";
  s.split(" ").forEach(function(w){
    if(line&&(line+" "+w).length>max){ out.push(line); line=w; } else line=line?line+" "+w:w;
  });
  if(line) out.push(line);
  return out;
}

function logoJpeg(){

}

  }

  if(!allPaid){

  } else {
    wrapText("Declaro que recebi de "+BAR.nome+" a quantia de "+money(total)+" ("+extenso(total)+
      "), referente "+(disc.length?"às diárias e aos lançamentos listados acima.":"às diárias listadas acima."),90)
      .forEach(function(l){ text(48,y,l,10.5); y-=15; });

    line(48,278,y); line(318,548,y);

    text(318,y-13,BAR.nome,9,true); text(318,y-25,"Assinatura de quem pagou",8,false,GRAY);
