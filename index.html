}
function buildPdf(pages){
  var objs=["<< /Type /Catalog /Pages 2 0 R >>",null,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"], kids=[];
  var jpg=logoJpeg(), xobj="";
  if(jpg){
    objs.push("<< /Type /XObject /Subtype /Image /Width 300 /Height 300 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n"+jpg+"\nendstream");
    xobj=" /XObject << /Logo "+objs.length+" 0 R >>";
  }
  pages.forEach(function(c){
    var n=objs.length+1; kids.push(n+" 0 R");
    objs.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>"+xobj+" >> /Contents "+(n+1)+" 0 R >>");
    objs.push("<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream");
  });
  objs[1]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+kids.length+" >>";
  var out="%PDF-1.4\n", pos=[];
  objs.forEach(function(b,i){ pos.push(out.length); out+=(i+1)+" 0 obj\n"+b+"\nendobj\n"; });
  var x=out.length;
  out+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n";
  pos.forEach(function(p){ out+=("000000000"+p).slice(-10)+" 00000 n \n"; });
  out+="trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+x+"\n%%EOF";
  var bytes=new Uint8Array(out.length);
  for(var i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
  return bytes;
}
function slug(s){
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
/* abre o compartilhar do celular (WhatsApp, imprimir, salvar); sem isso, baixa o PDF */
function emitPayslips(ids,byPerson,r){
  var q=quinzena(r.start);
  var pages=ids.map(function(pid){ return payslipPage(pid,byPerson[pid].entries,q); });
  var who=ids.length===1?slug(nameOf({personId:ids[0]})):"todos";
  var file=new File([buildPdf(pages)],"holerite-"+who+"-"+q.start+".pdf",{type:"application/pdf"});
  function download(){
    var url=URL.createObjectURL(file);
    var a=h("a",{href:url,download:file.name});
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},60000);
    toast("Holerite baixado.");
  }
  var can=false;
  try{ can=!!(navigator.canShare&&navigator.canShare({files:[file]})); }catch(e){}
  if(!can){ download(); return; }
  navigator.share({files:[file]}).catch(function(err){ if(!err||err.name!=="AbortError") download(); });
}

/* ================== PESSOAS ================== */
function renderPessoas(){
  var main=$("#main"); main.textContent="";
  addChild(main,header("Pessoas",
    h("button",{class:"btn primary",type:"button",onclick:openPersonForm.bind(null,null)},icon("plus"),h("span",{text:"Nova pessoa"}))
  ));

  /* funções */
  addChild(main,h("p",{class:"section-title",text:"Funções"}));
  var fDiv=h("div",{class:"chips"});
  db.functions.forEach(function(fn,i){
    var c=h("button",{class:"chip",type:"button",onclick:function(){
      if(confirm('Remover função "'+fn+'"?')){
        db.functions.splice(i,1); commit();
      }
    }},h("span",{text:fn}),h("span",{class:"x",text:"x"}));
    fDiv.appendChild(c);
  });
  fDiv.appendChild(h("button",{class:"chip",type:"button",onclick:function(){
    var name=prompt("Nome da nova função:");
    if(name&&name.trim()){
      db.functions.push(name.trim()); commit("Função adicionada!");
    }
  }},icon("plus"),h("span",{text:"Adicionar"})));
  main.appendChild(fDiv);

  /* lista de pessoas */
  addChild(main,h("p",{class:"section-title",text:"Cadastro",style:"margin-top:22px;"}));

  var active=db.people.filter(function(p){return p.active!==false;}).sort(function(a,b){return a.name.localeCompare(b.name,"pt-BR");});
  var inactive=db.people.filter(function(p){return p.active===false;}).sort(function(a,b){return a.name.localeCompare(b.name,"pt-BR");});

  if(active.length===0&&inactive.length===0){
    main.appendChild(h("div",{class:"empty"},
      h("b",{text:"Nenhuma pessoa cadastrada"}),
      h("span",{text:"Toque em \"Nova pessoa\" para começar."})
    ));
  }

  active.forEach(function(p){ main.appendChild(renderPersonCard(p)); });

  if(inactive.length>0){
    addChild(main,h("p",{class:"section-title",text:"Inativos",style:"margin-top:16px;"}));
    inactive.forEach(function(p){ main.appendChild(renderPersonCard(p)); });
  }

  renderCloud(main);

  /* backup/restore */
  addChild(main,h("p",{class:"section-title",text:"Dados",style:"margin-top:28px;"}));
  var dataDiv=h("div",{style:"display:flex;flex-direction:column;gap:8px;"});

  dataDiv.appendChild(h("button",{class:"btn block",type:"button",onclick:exportBackup},
    icon(canShareFiles?"wa":"down"),h("span",{text:canShareFiles?"Salvar backup no WhatsApp":"Baixar backup"})));
  var bd=backupDays();
  dataDiv.appendChild(h("p",{class:"note",text:bd===null?"Nenhum backup feito ainda.":
    "Último backup: "+agoText(bd)+"."}));

  /* aceita .txt (backup mandado pelo WhatsApp) e .json (backups antigos) */
  var fileInput=h("input",{type:"file",accept:".txt,.json,text/plain,application/json",style:"display:none",onchange:function(e){
    var f=e.target.files[0]; if(!f) return;
    e.target.value=""; /* deixa escolher o mesmo arquivo de novo */
    var reader=new FileReader();
    reader.onload=function(ev){
      try {
        var data=JSON.parse(ev.target.result);
        if(!Array.isArray(data.people)||!Array.isArray(data.entries)) throw new Error("Formato inválido");
        normalizeDb(data);
        /* mostra de quando é o backup e compara com o que está no celular: restaurar um
           backup velho sem perceber faz pagamentos voltarem para "a pagar" (e serem pagos de novo) */
        var when=data.settings&&data.settings.lastBackup, d=daysSince(when), dt=new Date(when);
        function nOf(n,one,many){ return n+" "+(n===1?one:many); }
        function what(o){ return nOf(o.people.length,"pessoa","pessoas")+" e "+nOf(o.entries.length,"dia registrado","dias registrados"); }
        if(!confirm((d===null?"Backup sem data.":"Backup de "+pad(dt.getDate())+"/"+pad(dt.getMonth()+1)+"/"+dt.getFullYear()+" ("+agoText(d)+").")+
          "\n\nNo backup: "+what(data)+".\nNeste celular agora: "+what(db)+"."+
          "\n\nRestaurar apaga o que está neste celular e coloca o backup no lugar."+
          (linkedUid()?" Vale para TODOS os celulares conectados.":"")+" Continuar?")) return;
        db.people=data.people;
        db.entries=data.entries;
        db.discounts=data.discounts;
        db.sends=data.sends;
        db.functions=Array.isArray(data.functions)?data.functions:[];
        db.settings=Object.assign(emptyDb().settings,data.settings||{});
        try{ localStorage.setItem(KEY+".danificado-visto","1"); }catch(e){}
        commit("Backup restaurado com sucesso!");
      } catch(err){
        toast("Arquivo inválido. Use um backup exportado daqui.");
      }
    };
    reader.readAsText(f);
  }});
  dataDiv.appendChild(h("button",{class:"btn block",type:"button",onclick:function(){fileInput.click();}},
    icon("up"),h("span",{text:"Restaurar backup"})));
  dataDiv.appendChild(fileInput);
  main.appendChild(dataDiv);
}

function openPersonForm(existing){
  var isNew=!existing;
  var body=h("div",{class:"form"});

  var iName=h("input",{type:"text",placeholder:"Ex: Maria Silva",value:existing?existing.name:""});
  body.appendChild(h("div",{class:"field"},h("label",{text:"Nome"}),iName));

  var iPhone=h("input",{type:"tel",placeholder:"(99) 99999-9999",value:existing?existing.phone||"":""});
  body.appendChild(h("div",{class:"field"},h("label",{text:"WhatsApp"}),iPhone));

  /* ao sair do campo, mostra o valor do jeito que o app entendeu (ex.: "1.500" vira "1500,00") */
  var iRate=h("input",{type:"text",inputmode:"decimal",placeholder:"Ex: 150,00",value:existing?moneyInput(existing.rate):"",
    onblur:function(){ var n=parseMoney(iRate.value); if(n) iRate.value=moneyInput(n); }});
  body.appendChild(h("div",{class:"field"},h("label",{text:"Valor por dia (R$)"}),iRate));

  var iPix=h("input",{type:"text",placeholder:"CPF, e-mail ou chave",value:existing?existing.pix||"":""});
  body.appendChild(h("div",{class:"field"},h("label",{text:"Chave Pix (opcional)"}),iPix));

  /* select de função */
  var iRole=h("select");
  iRole.appendChild(h("option",{value:"",text:"Sem função"}));
  db.functions.forEach(function(fn){
    var opt=h("option",{value:fn,text:fn});
    if(existing&&existing.role===fn) opt.selected=true;
    iRole.appendChild(opt);
  });
  body.appendChild(h("div",{class:"field"},h("label",{text:"Função"}),iRole,
    h("span",{class:"hint",text:"Gerencie as funções na lista acima."})
  ));

  body.appendChild(h("button",{class:"btn primary block",type:"button",text:isNew?"Cadastrar":"Salvar",onclick:function(){
    var name=iName.value.trim();
    if(!name){ toast("Preencha o nome."); return; }
    /* sem DDD o WhatsApp não abre, e o botão de mandar o resumo some sem explicação */
    var phone=iPhone.value.trim();
    if(phone&&!waNumber(phone)){ toast("Coloque o WhatsApp com DDD. Ex: (11) 99999-9999"); return; }
    var rate=parseMoney(iRate.value);
    if(!(rate>0)){ toast("Preencha o valor da diária."); return; }
    if(isNew){
      db.people.push({
        id:uid(), name:name, phone:phone, rate:rate,
        pix:iPix.value.trim(), role:iRole.value, active:true,
        createdAt:new Date().toISOString()
      });
      closeSheet(); commit(firstName(name)+" cadastrado!");
    } else {
      var p=person(existing.id)||existing; /* os dados podem ter sido recarregados com a janela aberta */
      /* diária nova: cada dia guarda o valor de quando foi escalado. Pergunta se o novo vale
         também para os dias ainda não pagos (os pagos ficam como foram pagos). */
      var applied=0;
      if(rate!==p.rate){
        var open=db.entries.filter(function(e){return e.personId===p.id&&!e.paid&&e.value!==rate;});
        if(open.length&&confirm("Usar "+money(rate)+" também "+
            (open.length===1?"no dia que ainda não foi pago":"nos "+open.length+" dias que ainda não foram pagos")+
            "?\n\nOK: sim.\nCancelar: só nos próximos dias que você escalar.")){
          db.entries.forEach(function(e){ if(e.personId===p.id&&!e.paid&&e.value!==rate) e.value=rate; });
          applied=open.length;
        }
      }
      p.name=name;
      p.phone=phone;
      p.rate=rate;
      p.pix=iPix.value.trim();
      p.role=iRole.value;
      closeSheet();
      commit(applied?"Diária atualizada também em "+applied+" dia"+(applied>1?"s":"")+".":"Dados atualizados.");
    }
  }}));

  /* excluir leva junto a escala e os lançamentos ainda não pagos; quem já recebeu algum
     pagamento fica no histórico (só dá para desativar) */
  if(!isNew){
    var mine=function(x){ return x.personId===existing.id; };
    if(db.entries.concat(db.discounts).some(function(x){ return mine(x)&&x.paid; })){
      body.appendChild(h("p",{class:"note",text:"Quem já teve pagamento registrado não pode ser excluído."+
        (existing.active===false?"":" Para não escalar mais, use \"Desativar\" na lista.")}));
    } else {
      var nDays=db.entries.filter(mine).length, nExtra=db.discounts.filter(mine).length;
      if(nDays||nExtra) body.appendChild(h("p",{class:"note",text:"Excluir apaga também "+
        nDays+" dia(s) de escala e "+nExtra+" desconto(s)/bônus desta pessoa."}));
      body.appendChild(confirmBtn("Excluir funcionário","Confirmar exclusão?","danger block",function(){
        syncDb();
        if(db.entries.concat(db.discounts).some(function(x){ return mine(x)&&x.paid; })){
          closeSheet(); render(); toast("Há um pagamento registrado. Não foi excluído."); return;
        }
        var not=function(x){ return !mine(x); };
        db.people=db.people.filter(function(p){return p.id!==existing.id;});
        db.entries=db.entries.filter(not); db.discounts=db.discounts.filter(not);
        closeSheet(); commit(firstName(existing.name)+" excluído.");
      }));
    }
  }

  openSheet(isNew?"Nova pessoa":"Editar "+firstName(existing.name),body);
}

/* backup: o arquivo vai pelo WhatsApp (ou outro app) para existir fora do celular.
   O Chrome do Android só compartilha alguns tipos de arquivo e .json não está entre
   eles, por isso o arquivo é .txt (o conteúdo continua sendo JSON). */
var canShareFiles=(function(){
  try { return !!(navigator.canShare&&navigator.canShare({files:[new File(["x"],"x.txt",{type:"text/plain"})]})); }
  catch(e){ return false; }
})();

/* dias desde uma data gravada (null = sem data) */
function daysSince(when){
  var t=Date.parse(when||"");
  if(isNaN(t)) return null;
  return Math.round((fromIso(today())-fromIso(dayOf(t)))/864e5);
}
function agoText(d){ return d<=0?"hoje":d===1?"ontem":"há "+d+" dias"; }
/* dias desde o último backup (null = nunca fez) */
function backupDays(){ return daysSince(db.settings.lastBackup); }

/* aviso de dados danificados: some quando ela restaura um backup ou toca em "Entendi"
   (a cópia continua guardada e segue indo junto nos backups) */
function damagedNotice(){
  var seen=null;
  try { seen=localStorage.getItem(KEY+".danificado-visto"); } catch(e){}
  if(!dbLocked&&(seen||!damagedKeys().length)) return null;
  return h("div",{class:"notice",style:"flex-wrap:wrap;background:var(--bad-bg);color:var(--bad);"},
    h("span",{style:"flex:1 1 100%;",text:dbLocked
      ?"Os dados deste celular estão danificados e o app não está salvando nada. Chame quem instalou o app."
      :"Os dados deste celular estavam danificados. Se tiver backup, restaure em Pessoas."}),
    dbLocked?null:h("button",{class:"btn sm",type:"button",text:"Restaurar",onclick:function(){ goTab("pessoas"); }}),
    dbLocked?null:h("button",{class:"btn sm",type:"button",text:"Entendi",onclick:function(){
      try{ localStorage.setItem(KEY+".danificado-visto","1"); }catch(e){}
      render();
    }}));
}

/* aviso na Escala: some por 7 dias depois de cada backup */
function backupNotice(){
  if(db.people.length===0) return null;
  var d=backupDays();
  if(d!==null&&d<7) return null;
  return h("div",{class:"notice"},
    h("span",{text:d===null?"Ainda sem backup.":"Faz "+d+" dias sem backup."}),
    h("button",{class:"btn sm",type:"button",text:canShareFiles?"Salvar no WhatsApp":"Baixar backup",onclick:exportBackup}));
}

function exportBackup(){
  var now=new Date().toISOString();
  /* o arquivo já leva a data deste backup: ao restaurar, o aviso conta a partir dela */
  var snap=Object.assign({},db,{settings:Object.assign({},db.settings,{lastBackup:now})});
  /* cópia de dados danificados (se houver) vai junto, para dar para recuperar fora do celular */
  var dmg=damagedKeys().map(function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } });
  if(dbLocked&&lastDamaged) dmg.push(lastDamaged);
  if(dmg.length) snap.danificado=dmg;
  var file=new File([JSON.stringify(snap,null,2)],"boteco-do-dida-backup-"+today()+".txt",{type:"text/plain"});
  function done(msg){ db.settings.lastBackup=now; commit(msg); }
  function download(){
    var url=URL.createObjectURL(file);
    var a=h("a",{href:url,download:file.name});
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},60000); /* revogar na hora cancela o download no Safari */
    done("Backup baixado.");
  }
  if(!canShareFiles){ download(); return; }
  navigator.share({files:[file]}).then(function(){ done("Backup feito!"); },function(err){
    if(err&&err.name==="AbortError") return; /* fechou sem escolher para onde mandar */
    download();
  });
}

});

/* ao voltar para o app: pega o que outra janela salvou, volta para o dia novo se o dia virou
   e atualiza a fila de envio do resumo (sem mexer numa janela aberta) */
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible") return;
  var changed=syncDb();
  if(today()!==ui.day){ resetToToday(); changed=true; }
  if(changed||(ui.tab==="resumo"&&!document.querySelector(".scrim"))) render();
});

/* ================== service worker ================== */
if("serviceWorker" in navigator){
  var hadController=!!navigator.serviceWorker.controller, reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    /* versão nova do app chegou: recarrega uma vez (os dados ficam no aparelho).
       Com uma janela aberta (ela digitando um cadastro, conferindo um pagamento),
       espera ela fechar, para não perder o que estava preenchido */
    if(!hadController||reloaded) return;
    reloaded=true;
    (function reloadWhenFree(){
      if(document.querySelector(".scrim")) return setTimeout(reloadWhenFree,1000);
      location.reload();
    })();
  });
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(reg){
    reg.update().catch(function(){});
    document.addEventListener("visibilitychange",function(){
      if(document.visibilityState==="visible") reg.update().catch(function(){});
    });
  }).catch(function(){});
}
})();
